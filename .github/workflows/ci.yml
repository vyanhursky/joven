name: CI

"on":
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Two axes, each earning its place. Python: pyproject claims >=3.11 but
    # development happened entirely on 3.13, so 3.11 and 3.12 were an untested
    # assertion until now. OS: Windows was untested and had four real bugs in it
    # -- `.cmd` launchers that shutil.which finds and CreateProcess cannot start,
    # an HTTP handler that reset the connection instead of answering, cp1252
    # output, and epubcheck shipping no Windows launcher at all. All four were
    # invisible to a Linux-only matrix.
    #
    # macOS is here despite being the platform this was developed and
    # device-verified on -- or rather because of it. It was the only platform
    # whose support rested entirely on the author remembering to run the suite
    # locally, which is the kind of coverage that holds right up until the release
    # someone else cuts. It is also the only one that reaches epubcheck through a
    # Homebrew launcher on PATH, a third route again from Linux's shell wrapper
    # and Windows' bare jar.
    #
    # The full cross-product would be nine jobs to catch nothing: a Python version
    # difference does not become a different bug on a different OS. Linux, where
    # the floor actually needs proving, runs all three; the other two run the
    # floor and the ceiling, which is where a version-specific break would show.
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, python: "3.11"}
          - {os: ubuntu-latest, python: "3.12"}
          - {os: ubuntu-latest, python: "3.13"}
          - {os: windows-latest, python: "3.11"}
          - {os: windows-latest, python: "3.13"}
          - {os: macos-latest, python: "3.11"}
          - {os: macos-latest, python: "3.13"}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      # epubcheck is the reference EPUB validator and needs a JVM. Without it the
      # EPUB-3 validation tests skip themselves, which would quietly hollow out
      # the part of the suite most likely to catch a real regression.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install epubcheck (Linux)
        if: runner.os == 'Linux'
        run: |
          curl -sSL -o /tmp/epubcheck.zip \
            https://github.com/w3c/epubcheck/releases/download/v5.1.0/epubcheck-5.1.0.zip
          unzip -q /tmp/epubcheck.zip -d /opt
          printf '#!/bin/sh\nexec java -jar /opt/epubcheck-5.1.0/epubcheck.jar "$@"\n' \
            | sudo tee /usr/local/bin/epubcheck >/dev/null
          sudo chmod +x /usr/local/bin/epubcheck
          epubcheck --version

      # No launcher is created here on purpose. The official distribution is a jar
      # and nothing else, which is what a Windows user actually downloads, so this
      # exercises the JOVEN_EPUBCHECK_JAR route rather than a wrapper invented for
      # CI's convenience. If that route regresses, epubcheck goes missing and the
      # assertion below fails.
      - name: Install epubcheck (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ProgressPreference = 'SilentlyContinue'
          Invoke-WebRequest -UseBasicParsing -OutFile epubcheck.zip `
            https://github.com/w3c/epubcheck/releases/download/v5.1.0/epubcheck-5.1.0.zip
          Expand-Archive epubcheck.zip -DestinationPath C:\tools
          "JOVEN_EPUBCHECK_JAR=C:\tools\epubcheck-5.1.0\epubcheck.jar" `
            | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      - name: Install kepubify (Linux)
        if: runner.os == 'Linux'
        run: |
          curl -sSL -o /tmp/kepubify \
            https://github.com/pgaskin/kepubify/releases/latest/download/kepubify-linux-64bit
          sudo install -m 0755 /tmp/kepubify /usr/local/bin/kepubify
          kepubify --version

      - name: Install kepubify (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ProgressPreference = 'SilentlyContinue'
          New-Item -ItemType Directory -Force C:\tools | Out-Null
          Invoke-WebRequest -UseBasicParsing -OutFile C:\tools\kepubify.exe `
            https://github.com/pgaskin/kepubify/releases/latest/download/kepubify-windows-64bit.exe
          "C:\tools" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
          C:\tools\kepubify.exe --version

      # One brew call for both, which is the route the README actually documents.
      # This is the only job that reaches epubcheck through a launcher Homebrew put
      # on PATH -- the case `external.resolve` has to keep working for the platform
      # most users are on.
      - name: Install epubcheck and kepubify (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install epubcheck kepubify
          epubcheck --version
          kepubify --version

      - name: Install the package
        shell: bash
        run: pip install -e '.[dev]'

      - name: Lint
        run: ruff check src tests tools

      - name: Test
        run: pytest -q

      # Skipped tests are the failure mode that matters here: if epubcheck went
      # missing, the suite would stay green while no longer checking the output is
      # a valid EPUB. Counting total skips is too brittle -- the four realbook
      # tests always skip (they need a book, and a book must never be committed)
      # and the one ollama test skips too, since no model server runs in CI. So
      # assert the specific subset that must not skip.
      - name: Assert the epubcheck tests actually ran
        # Explicitly bash: the Windows runners default to pwsh, where this reads
        # as a syntax error rather than as the check it is.
        shell: bash
        run: |
          out=$(pytest -q -m "epubcheck and not realbook" -rs 2>&1)
          echo "$out"
          if echo "$out" | grep -q "skipped"; then
            echo "::error::epubcheck-dependent tests skipped -- is epubcheck on PATH, or JOVEN_EPUBCHECK_JAR set?"
            exit 1
          fi

  guards:
    # Two checks that have each caught a real bug that survived a careful manual
    # read of the same files minutes earlier.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - run: pip install -e '.[dev]'

      # Adding this surfaced 21 findings, every one an Optional from lxml that the
      # code assumed non-None. None was a live bug -- but each was exactly the shape
      # of the getparent()-on-root crash that would be, and ruff cannot see them.
      - name: Type-check
        run: mypy

      - name: No book content in the repository
        # Pattern mode: CI has no book to diff against, and never should. The
        # stronger content-based check runs locally with the book supplied.
        run: python tools/check_no_book_content.py

      - name: Documented commands all exist
        run: python tools/check_docs.py --executable joven

  app:
    # The downloadable app, for readers who will never open a terminal. Built on
    # every push and not only on tags, because the spec breaks silently: a build
    # that omits lingua still starts, still serves the page, and dies at the first
    # paragraph of the first detect. The smoke step below is what catches that.
    #
    # One runner per platform because PyInstaller does not cross-compile, and
    # kepubify is fetched per host for the same reason.
    needs: [test, guards]
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: windows-latest, asset: Joven-windows-x64}
          - {os: macos-latest, asset: Joven-macos-arm64}
          - {os: ubuntu-latest, asset: Joven-linux-x64}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - run: pip install -e . pyinstaller

      - name: Fetch the bundled binaries
        run: python packaging/fetch_vendor.py

      - name: Build
        run: pyinstaller packaging/joven.spec --noconfirm --distpath packaging/dist --workpath packaging/build

      # A build can succeed and still be unusable, so run the thing. `doctor`
      # exercises the frozen entry point, the config, and -- the part the spec
      # gets wrong when it gets anything wrong -- the bundled kepubify lookup.
      # It exits 1 here because no runner has a model server, so check the
      # output rather than the status.
      - name: Smoke-test the built app (Unix)
        if: runner.os != 'Windows'
        run: |
          app="packaging/dist/Joven/Joven"
          [ -d "packaging/dist/Joven.app" ] && app="packaging/dist/Joven.app/Contents/MacOS/Joven"
          "$app" doctor > doctor.txt || true
          cat doctor.txt
          grep -q "model server" doctor.txt
          grep -q "\[OK  \] kepubify" doctor.txt

      - name: Smoke-test the built app (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          packaging/dist/Joven/Joven.exe doctor > doctor.txt || true
          cat doctor.txt
          grep -q "model server" doctor.txt
          grep -q "\[OK  \] kepubify" doctor.txt

      # onedir, so it has to be one file before anyone can download it. macOS
      # gets a DMG because that is what a Mac user expects to double-click;
      # everything else gets an archive that preserves the executable bit.
      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          hdiutil create -volname Joven -srcfolder packaging/dist/Joven.app \
            -ov -format UDZO "${{ matrix.asset }}.dmg"

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: tar -C packaging/dist -czf "${{ matrix.asset }}.tar.gz" Joven

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path packaging/dist/Joven -DestinationPath "${{ matrix.asset }}.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: |
            ${{ matrix.asset }}.zip
            ${{ matrix.asset }}.dmg
            ${{ matrix.asset }}.tar.gz
          if-no-files-found: error
          retention-days: 14

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # A tag that disagrees with pyproject produces a release nobody can install
      # by the name they were told. Cheap to check, impossible to undo on PyPI --
      # a version number is the one thing a release cannot take back.
      - name: Tag must match the project version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tagged="${GITHUB_REF_NAME#v}"
          declared=$(python -c "
          import tomllib, pathlib
          print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])
          ")
          echo "tag $tagged / pyproject $declared"
          if [ "$tagged" != "$declared" ]; then
            echo "::error::tag v$tagged does not match pyproject version $declared"
            exit 1
          fi

      # The release notes are the CHANGELOG section for this version, so a tag
      # without one has nothing to say for itself. Checked here, before publish,
      # because after the PyPI upload the version number is spent either way.
      - name: CHANGELOG must have a section for this version
        if: startsWith(github.ref, 'refs/tags/v')
        run: python tools/changelog_section.py "${GITHUB_REF_NAME#v}" > /dev/null

      - run: pip install build twine
      - run: python -m build
      - name: Check the distribution metadata
        run: twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*

  publish:
    # Ships to PyPI on a v* tag and nothing else. Uses Trusted Publishing, so
    # there is no API token in repository secrets to leak or rotate -- PyPI
    # verifies the workflow's OIDC identity instead.
    #
    # One-time setup, on pypi.org under the project's Publishing settings:
    #   owner        vyanhursky
    #   repository   joven
    #   workflow     ci.yml
    #   environment  pypi
    # The environment name must match the `environment:` below on both sides.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, guards, package]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # the OIDC token Trusted Publishing authenticates with
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - uses: pypa/gh-action-pypi-publish@release/v1

  release:
    # The GitHub release mirrors the PyPI one: same trigger, same files, and its
    # notes are the CHANGELOG section rather than a second copy of it. It runs
    # after publish so a release page never points at a version pip cannot find.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [publish, app]
    runs-on: ubuntu-latest
    permissions:
      contents: write  # to create the release and attach the files
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      # The three downloadable apps, each artifact holding one archive. They are
      # what the README's download links point at, so a release without them is a
      # release whose front door is broken.
      - uses: actions/download-artifact@v4
        with:
          pattern: Joven-*
          path: apps
          merge-multiple: true

      - name: Create the GitHub release from the CHANGELOG
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          python tools/changelog_section.py "$version" > notes.md
          prerelease=""
          case "$version" in
            *a*|*b*|*rc*) prerelease="--prerelease" ;;
          esac
          ls -lh apps/
          gh release create "$GITHUB_REF_NAME" dist/* apps/* \
            --verify-tag --title "$GITHUB_REF_NAME" --notes-file notes.md $prerelease
