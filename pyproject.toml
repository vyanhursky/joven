[project]
name = "joven-ebook-annotator"
version = "1.0.0b1"
description = "Insert clickable translation footnotes for foreign-language passages in an EPUB"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Vlad Yanhursky" }]
keywords = ["epub", "kobo", "ebook", "translation", "footnotes", "annotation", "kepub"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Text Processing :: Markup :: XML",
    "Topic :: Utilities",
]
dependencies = [
    "lxml>=5.2",
    "typer>=0.12",
    "lingua-language-detector>=2.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]
# The paid backend is opt-in: the offline pipeline must keep working without it.
claude = ["anthropic>=0.122"]

[project.urls]
Homepage = "https://github.com/vyanhursky/joven"
Repository = "https://github.com/vyanhursky/joven"
Issues = "https://github.com/vyanhursky/joven/issues"
Changelog = "https://github.com/vyanhursky/joven/blob/main/CHANGELOG.md"

[project.scripts]
joven = "joven.cli:app"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "realbook: needs JOVEN_TEST_EPUB pointing at a real EPUB (opt-in)",
    "epubcheck: needs the epubcheck binary on PATH",
    "ollama: needs a running ollama server",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# typer's entire API is function calls in argument defaults
"src/joven/cli.py" = ["B008"]
